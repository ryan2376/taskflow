# ============================================================================
#  application-dev.yml  —  LOCAL DEVELOPMENT profile (active by default).
#
#  Talks to the PostgreSQL container defined in docker-compose.yml. Credentials
#  here are LOCAL-ONLY and harmless; they intentionally match the compose file.
#  We still read them via ${VAR:default} so you can override without editing code.
# ============================================================================

spring:
  datasource:
    # jdbc:postgresql://<host>:<port>/<database>
    # Host port 5433 (the Docker container's mapped port) — see docker-compose.yml.
    # A native PostgreSQL on this machine already uses 5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}

  jpa:
    # Log every SQL statement Hibernate runs — invaluable while learning.
    show-sql: true
    properties:
      hibernate:
        format_sql: true   # Pretty-print that SQL across multiple lines.

logging:
  level:
    # See the SQL Hibernate generates...
    org.hibernate.SQL: DEBUG
    # ...and the actual bound parameter values that fill the '?' placeholders.
    org.hibernate.orm.jdbc.bind: TRACE

# A development-only JWT secret so local runs work without any setup.
# Production NEVER uses a default — see application-prod.yml.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789-abcdefghij}
